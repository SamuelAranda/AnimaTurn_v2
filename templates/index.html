<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Combat Tracker</title>

<link rel="stylesheet" href="/static/style.css">

<script src="/static/script.js"></script>

</head>

<body>

<h1>Combat Tracker</h1>

Nombre
<input id="nombre" type="text">

Velocidad
<input id="velocidad" type="number" inputmode="numeric">

Estilo
<input id="estilo" type="number" inputmode="numeric" value="0">

<div class="bando-selector">
<label><input type="radio" name="bando" value="aliado"> Aliado</label>
<label><input type="radio" name="bando" value="enemigo"> Enemigo</label>
</div>

<br>

<button onclick="add()">Añadir personaje</button>
<button onclick="roll()">Generar iniciativa</button>

<button onclick="nextRound()">Siguiente ronda</button>
<button onclick="clearSession()">Limpiar sesión</button>

<h2>Personajes</h2>
<div id="personajes"></div>

<h2>Resultado</h2>
<div id="resultado"></div>

</body>

</html>
